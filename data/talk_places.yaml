# Каталог мест, куда менеджеру ходить за возможностями выступить / дать экспертность.
#
# kind: media | podcast | tv | conference | community
# how: expert_comment | column | interview | podcast_guest | cfp_talk | workshop
#
# Pitch 2.0 (P0) — доп. поля:
#   pitch_url       — страница подачи / tips / редактор (НЕ homepage)
#   how_to          — 1–3 предложения: как зайти
#   example_topics  — углы, которые сюда заходят
#   contact_hint    — куда писать (только если публично известно; без выдумок)
#
# actionable = есть pitch_url | cfp_url | how_to → иначе площадка не в топ /pitch.
# Дедлайны у evergreen не выдумываем. CFP-конференции — data/open_cfp.yaml.

