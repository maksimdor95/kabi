# Каталог мест, куда менеджеру ходить за возможностями выступить / дать экспертность.
#
# Выведен на примере реального медиа-следа product/HR-tech эксперта
# (публикации, эфиры, колонки). Это НЕ заточка под одного человека:
# набор площадок типичен для Head of Product / CPO / skill-based / EdTech / HR-tech.
#
# kind:
#   media      — СМИ / отраслевые издания (коммент, колонка, интервью)
#   podcast    — подкасты / YouTube / аудио
#   tv         — ТВ / крупные эфиры
#   conference — сценические конференции (часто с CFP)
#   community  — отраслевые площадки / edu-медиа
#
# how (что предлагать):
#   expert_comment | column | interview | podcast_guest | cfp_talk | workshop
#
# Статус M3: seed → Opportunity(type=talk). Живые парсеры CFP — позже по месту.

