# Карьерные сайты компаний (M7c). Публичный HTML/JSON, без логина.
# kind:
#   yandex_api | alfa_api | wb_api | sber_api | mts_api — JSON (волна A из Leo)
#   html_list  — листинг HTML; path_regex / path_exclude уточняют ссылки

sites:
  - id: yandex
    name: Яндекс
    kind: yandex_api
    enabled: true
    list_url: https://yandex.ru/jobs/api/publications
    vacancy_url_template: https://yandex.ru/jobs/vacancies/{slug}

  - id: sber
    name: Сбер
    kind: sber_api
    enabled: true
    list_url: https://rabota.sber.ru/public/app-candidate-public-api-gateway/api/v1/publications

  - id: tbank
    name: Т-Банк
    kind: html_list
    enabled: true
    list_url: https://www.tbank.ru/career/vacancies/all/moscow/
    link_contains:
      - /career/service/vacancy/
    path_regex: "/career/service/vacancy/[^/]+/[^/]+/[0-9a-f-]{8,}"
    path_exclude:
      - operator-rannego
      - predstavitel

  - id: avito
    name: Авито
    kind: html_list
    enabled: true
    list_url: https://career.avito.com/vacancies/
    link_contains:
      - /vacancies/
    path_regex: "/vacancies/[^/]+/\\d+"
    path_exclude:
      - /teams/job/

  - id: vk
    name: VK
    kind: html_list
    enabled: true
    list_url: https://team.vk.company/vacancy/?search=&town=
    link_contains:
      - /vacancy/
    path_regex: "/vacancy/\\d+"

  - id: alfa
    name: Альфа-Банк
    kind: alfa_api
    enabled: true
    # TLS: self-signed intermediate на части окружений
    ssl_verify: false
    list_url: https://job.alfabank.ru/api/vacancies

  - id: ozon
    name: Ozon
    kind: html_list
    # Antibot redirect loop — backlog (как в Leo).
    enabled: false
    list_url: https://job.ozon.ru/
    link_contains:
      - vacancy
      - vacancies
      - job

  - id: mts
    name: МТС
    kind: mts_api
    enabled: true
    list_url: https://job.mts.ru/api/v2/vacancies

  - id: wildberries
    name: Wildberries
    kind: wb_api
    enabled: true
    api_base: https://career.rwb.ru
    list_url: https://career.rwb.ru/crm-api/api/v1/pub/vacancies

# Фильтр по тексту ссылки/якоря (роли профиля CPO/HoP).
title_relevance_any:
  - product
  - продукт
  - продакт
  - cpo
  - "head of"
  - owner
  - lead
  - директор
  - руководитель
  - manager
  - менеджер
