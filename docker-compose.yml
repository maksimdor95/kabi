services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kabi}
      POSTGRES_USER: ${POSTGRES_USER:-kabi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # app и bot добавим как сервисы по мере реализации M1
  # app:
  #   build: .
  #   env_file: .env
  #   depends_on: [postgres, redis]

volumes:
  pgdata:
